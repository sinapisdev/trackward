<!-- @dsCard group="Colors" viewport="700x150" name="Situação colours" subtitle="Atrasado, vence em breve, em dia — colour never travels alone" -->
<!doctype html><html data-ds="trackward" lang="pt-BR"><head><meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<script src="../../ds-boot.js"></script>
<script>/* sandbox preview: subresources are only served with the page's ?t= token */
(function(){var t=new URL(location.href).searchParams.get("t");if(!t)return;var e=document.createElement("script");e.src="../../ds-boot.js?t="+t;e.onload=function(){DSStyles()};document.head.appendChild(e)})();</script>
<style>html,body{margin:0;background:var(--bg-page);color:var(--text-body);font-family:var(--font-ui)}.wrap{padding:20px 22px;display:grid;gap:14px}.sw{display:flex;gap:10px;flex-wrap:wrap}.chip{display:grid;gap:7px;min-width:96px}.box{height:56px;border-radius:var(--r-md);border:1px solid var(--border-hairline)}.nm{color:var(--ink-1);font:var(--type-micro)}.hx{color:var(--ink-3);font:var(--type-micro);letter-spacing:.02em}</style>
</head><body><div class="wrap"><div class="sw" style="gap:26px;align-items:flex-start">
<div class="chip" style="min-width:150px"><div style="display:flex;align-items:center;gap:9px"><span style="width:10px;height:10px;border-radius:999px;background:var(--danger)"></span><span style="color:var(--danger-text);font:var(--fw-medium) 15px/1 var(--font-ui)">Atrasado</span></div><span class="nm">--danger / --danger-text</span><span class="hx">#FF4B4B / #FF5A5A</span></div>
<div class="chip" style="min-width:170px"><div style="display:flex;align-items:center;gap:9px"><span style="width:10px;height:10px;border-radius:999px;background:var(--warn)"></span><span style="color:var(--warn-text);font:var(--fw-medium) 15px/1 var(--font-ui)">Vence em breve</span></div><span class="nm">--warn / --warn-text</span><span class="hx">#FFB224 / #FFA81E</span></div>
<div class="chip" style="min-width:120px"><div style="display:flex;align-items:center;gap:9px"><span style="width:10px;height:10px;border-radius:999px;background:var(--neutral-status)"></span><span style="color:var(--ink-1);font:var(--fw-medium) 15px/1 var(--font-ui)">Em dia</span></div><span class="nm">--neutral-status</span><span class="hx">#A9ADB3</span></div>
<div class="chip" style="min-width:110px"><div style="display:flex;align-items:center;gap:9px"><span style="width:10px;height:10px;border-radius:999px;background:var(--ok)"></span><span style="color:var(--ink-1);font:var(--fw-medium) 15px/1 var(--font-ui)">Agora</span></div><span class="nm">--ok</span><span class="hx">#D0FA3C</span></div>
</div></div></body></html>
