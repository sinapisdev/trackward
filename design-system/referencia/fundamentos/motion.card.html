<!-- @dsCard group="Spacing" viewport="700x170" name="Motion" subtitle="120ms hovers, 280ms reveals, one easing curve" -->
<!doctype html><html data-ds="trackward" lang="pt-BR"><head><meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<script src="../../ds-boot.js"></script>
<script>/* sandbox preview: subresources are only served with the page's ?t= token */
(function(){var t=new URL(location.href).searchParams.get("t");if(!t)return;var e=document.createElement("script");e.src="../../ds-boot.js?t="+t;e.onload=function(){DSStyles()};document.head.appendChild(e)})();</script>
<style>html,body{margin:0;background:var(--bg-page);color:var(--text-body);font-family:var(--font-ui)}.wrap{padding:20px 22px;display:grid;gap:14px}.sw{display:flex;gap:10px;flex-wrap:wrap}.chip{display:grid;gap:7px;min-width:96px}.box{height:56px;border-radius:var(--r-md);border:1px solid var(--border-hairline)}.nm{color:var(--ink-1);font:var(--type-micro)}.hx{color:var(--ink-3);font:var(--type-micro);letter-spacing:.02em}@keyframes run{from{width:8%}to{width:100%}}</style>
</head><body><div class="wrap"><div style="display:grid;gap:14px">
<div style="display:grid;grid-template-columns:120px 1fr 190px;gap:14px;align-items:center"><span class="nm">--dur-fast</span><div style="height:6px;border-radius:999px;background:var(--n-800);overflow:hidden"><div style="height:100%;border-radius:999px;background:var(--lime-500);animation:run 1.2s var(--ease-out) infinite alternate"></div></div><span class="hx">120ms · hover / press</span></div><div style="display:grid;grid-template-columns:120px 1fr 190px;gap:14px;align-items:center"><span class="nm">--dur-base</span><div style="height:6px;border-radius:999px;background:var(--n-800);overflow:hidden"><div style="height:100%;border-radius:999px;background:var(--lime-500);animation:run 1.5s var(--ease-out) infinite alternate"></div></div><span class="hx">180ms · toggles, tabs</span></div><div style="display:grid;grid-template-columns:120px 1fr 190px;gap:14px;align-items:center"><span class="nm">--dur-slow</span><div style="height:6px;border-radius:999px;background:var(--n-800);overflow:hidden"><div style="height:100%;border-radius:999px;background:var(--lime-500);animation:run 1.7999999999999998s var(--ease-out) infinite alternate"></div></div><span class="hx">280ms · folder carousel, progress</span></div><div style="display:grid;grid-template-columns:120px 1fr 190px;gap:14px;align-items:center"><span class="nm">--dur-reveal</span><div style="height:6px;border-radius:999px;background:var(--n-800);overflow:hidden"><div style="height:100%;border-radius:999px;background:var(--lime-500);animation:run 2.0999999999999996s var(--ease-out) infinite alternate"></div></div><span class="hx">420ms · panels entering</span></div>
<span class="hx">--ease-out cubic-bezier(.22,.61,.36,1) for everything; --ease-spring only on the folder stack.</span>
</div></div></body></html>
