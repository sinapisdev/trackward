<!-- @dsCard group="Colors" viewport="700x140" name="White alphas" subtitle="Hairlines, hovers and glass are white at 4–20%" -->
<!doctype html><html data-ds="trackward" lang="pt-BR"><head><meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<script src="../../ds-boot.js"></script>
<script>/* sandbox preview: subresources are only served with the page's ?t= token */
(function(){var t=new URL(location.href).searchParams.get("t");if(!t)return;var e=document.createElement("script");e.src="../../ds-boot.js?t="+t;e.onload=function(){DSStyles()};document.head.appendChild(e)})();</script>
<style>html,body{margin:0;background:var(--bg-page);color:var(--text-body);font-family:var(--font-ui)}.wrap{padding:20px 22px;display:grid;gap:14px}.sw{display:flex;gap:10px;flex-wrap:wrap}.chip{display:grid;gap:7px;min-width:96px}.box{height:56px;border-radius:var(--r-md);border:1px solid var(--border-hairline)}.nm{color:var(--ink-1);font:var(--type-micro)}.hx{color:var(--ink-3);font:var(--type-micro);letter-spacing:.02em}</style>
</head><body><div class="wrap"><div class="sw">
<div class="chip"><div class="box" style="background:var(--white-04);border-color:var(--border-hairline)"></div><span class="nm">--white-04</span><span class="hx">hover fill</span></div>
<div class="chip"><div class="box" style="background:var(--white-06);"></div><span class="nm">--white-06</span><span class="hx">hairline / icon hover</span></div>
<div class="chip"><div class="box" style="background:var(--white-08);"></div><span class="nm">--white-08</span><span class="hx">--border-hairline</span></div>
<div class="chip"><div class="box" style="background:var(--white-12);"></div><span class="nm">--white-12</span><span class="hx">--border-default</span></div>
<div class="chip"><div class="box" style="background:var(--white-20);"></div><span class="nm">--white-20</span><span class="hx">underline rest</span></div>
<div class="chip"><div class="box" style="background:var(--surface-glass);"></div><span class="nm">--surface-glass</span><span class="hx">glass fill 5%</span></div>
</div></div></body></html>
