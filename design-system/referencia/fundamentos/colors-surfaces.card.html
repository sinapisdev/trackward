<!-- @dsCard group="Colors" viewport="700x140" name="Dark surfaces" subtitle="Near-black page up to the folder-card body" -->
<!doctype html><html data-ds="trackward" lang="pt-BR"><head><meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<script src="../../ds-boot.js"></script>
<script>/* sandbox preview: subresources are only served with the page's ?t= token */
(function(){var t=new URL(location.href).searchParams.get("t");if(!t)return;var e=document.createElement("script");e.src="../../ds-boot.js?t="+t;e.onload=function(){DSStyles()};document.head.appendChild(e)})();</script>
<style>html,body{margin:0;background:var(--bg-page);color:var(--text-body);font-family:var(--font-ui)}.wrap{padding:20px 22px;display:grid;gap:14px}.sw{display:flex;gap:10px;flex-wrap:wrap}.chip{display:grid;gap:7px;min-width:96px}.box{height:56px;border-radius:var(--r-md);border:1px solid var(--border-hairline)}.nm{color:var(--ink-1);font:var(--type-micro)}.hx{color:var(--ink-3);font:var(--type-micro);letter-spacing:.02em}</style>
</head><body><div class="wrap"><div class="sw">
<div class="chip"><div class="box" style="background:var(--n-950);"></div><span class="nm">--n-950</span><span class="hx">#0A0B0A page</span></div>
<div class="chip"><div class="box" style="background:var(--n-900);"></div><span class="nm">--n-900</span><span class="hx">#0E1011 bar</span></div>
<div class="chip"><div class="box" style="background:var(--n-880);"></div><span class="nm">--n-880</span><span class="hx">#121516 rail</span></div>
<div class="chip"><div class="box" style="background:var(--n-850);"></div><span class="nm">--n-850</span><span class="hx">#171A1A chip</span></div>
<div class="chip"><div class="box" style="background:var(--n-800);"></div><span class="nm">--n-800</span><span class="hx">#1E2223 input</span></div>
<div class="chip"><div class="box" style="background:var(--n-750);"></div><span class="nm">--n-750</span><span class="hx">#232726 card</span></div>
<div class="chip"><div class="box" style="background:var(--n-700);"></div><span class="nm">--n-700</span><span class="hx">#2A2F30 border</span></div>
<div class="chip"><div class="box" style="background:var(--n-600);"></div><span class="nm">--n-600</span><span class="hx">#393D3E avatar</span></div>
</div></div></body></html>
