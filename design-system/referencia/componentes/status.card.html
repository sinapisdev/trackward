<!-- @dsCard group="Components" viewport="700x340" name="Status — trilha, progress, situações" subtitle="The trilha plus the fixed vocabulary of work states" -->
<!doctype html><html data-ds="trackward" lang="pt-BR"><head><meta charset="utf-8"><title>TrackWard</title>
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="https://unpkg.com/lucide@0.454.0/dist/umd/lucide.min.js"></script>
<script src="../../ds-boot.js"></script>
<script>/* preview shim: this sandbox only serves subresources with the page's ?t= token */
(function(){var t=new URL(location.href).searchParams.get("t");if(!t)return;var q="?t="+t;
var l=document.createElement("link");l.rel="stylesheet";l.href="../../styles.css"+q;document.head.appendChild(l);
["../../ds-boot.js"].forEach(function(s){var e=document.createElement("script");e.src=s+q;e.async=false;document.head.appendChild(e)});})();</script>
<style>html,body{margin:0;background:var(--bg-page)}#root{padding:22px 24px}.row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.col{display:grid;gap:16px}.lbl{color:var(--ink-3);font:var(--type-micro);letter-spacing:.06em;text-transform:uppercase}</style>
</head><body><div id="root"></div>
<script type="text/babel" data-presets="react">
(function wait(){ if (!window.DSBoot) return setTimeout(wait, 40);
DSBoot().then(NS => {
  const { CheckpointTrail, StatusPill, StatusDot, ProgressBar, ProgressRing, MetricStat, Divider } = NS;
  const Card = () => (
    <div className="col" style={{gap:22}}>
      <CheckpointTrail current={1}
        steps={[{label:"Preparação",meta:"Aprovado"},{label:"Cadastro",meta:"1 de 3 tarefas"},{label:"Validação",meta:"Próximo"},{label:"Entrega",meta:"Final"}]} />
      <Divider />
      <div className="row" style={{gap:28}}>
        <StatusPill status="late" />
        <StatusPill status="blocked" />
        <StatusPill status="soon" />
        <StatusPill status="onTrack" />
        <StatusPill status="pending" variant="chip" />
        <StatusPill status="todo" variant="chip" label="A fazer" />
      </div>
      <div className="row" style={{gap:34}}>
        <ProgressBar value={33} width={180} />
        <ProgressBar value={65} label width={220} />
        <div className="row" style={{gap:12}}>
          <ProgressRing value={33} />
          <span style={{font:"var(--fw-bold) var(--fs-metric)/1 var(--font-display)",color:"var(--ink-0)",letterSpacing:"var(--ls-metric)"}}>33%</span>
        </div>
      </div>
      <Divider />
      <div className="row" style={{gap:44}}>
        <MetricStat icon="alert-circle" tone="danger" value={2} label="Atrasadas" />
        <MetricStat icon="lock" value={1} label="Travada" />
        <MetricStat icon="clock" tone="warn" value={3} label="Vencem em breve" />
      </div>
    </div>
  );
  ReactDOM.createRoot(document.getElementById("root")).render(<Card />);
}).catch(e => { document.getElementById("root").innerHTML = '<pre style="color:#FF5A5A;font:13px/1.5 monospace">'+e.message+'</pre>'; }); })();
</script></body></html>
