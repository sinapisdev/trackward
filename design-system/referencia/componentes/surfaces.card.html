<!-- @dsCard group="Components" viewport="700x400" name="Surfaces — folders, tables, panels" subtitle="Glass folder cards and hairline tables" -->
<!doctype html><html data-ds="trackward" lang="pt-BR"><head><meta charset="utf-8"><title>TrackWard</title>
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="https://unpkg.com/lucide@0.454.0/dist/umd/lucide.min.js"></script>
<script src="../../ds-boot.js"></script>
<script>/* preview shim: this sandbox only serves subresources with the page's ?t= token */
(function(){var t=new URL(location.href).searchParams.get("t");if(!t)return;var q="?t="+t;
var l=document.createElement("link");l.rel="stylesheet";l.href="../../styles.css"+q;document.head.appendChild(l);
["../../ds-boot.js"].forEach(function(s){var e=document.createElement("script");e.src=s+q;e.async=false;document.head.appendChild(e)});})();</script>
<style>html,body{margin:0;background:var(--bg-page)}#root{padding:22px 24px}.row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.col{display:grid;gap:16px}.lbl{color:var(--ink-3);font:var(--type-micro);letter-spacing:.06em;text-transform:uppercase}</style>
</head><body><div id="root"></div>
<script type="text/babel" data-presets="react">
(function wait(){ if (!window.DSBoot) return setTimeout(wait, 40);
DSBoot().then(NS => {
  const { FolderCard, DataTable, Panel, ListRow, InfoRow, SectionHeader, StatusPill, ProgressBar, Avatar, AvatarGroup, ProgressRing, Icon, IconButton } = NS;
  const Card = () => (
    <div className="col" style={{gap:22}}>
      <div className="row" style={{gap:24,alignItems:"flex-start"}}>
        <FolderCard kicker="Projeto" title="Implantação do ERP" width={300}
          footer={<><span>1 de 3 tarefas prontas</span><AvatarGroup people={["Leonardo E","Ana N","Mariana C"]} size="sm" /></>}>
          <StatusPill status="todo" label="Cadastro" />
          <div style={{display:"flex",alignItems:"center",gap:14}}>
            <ProgressRing value={33} />
            <span style={{display:"grid"}}>
              <span style={{font:"var(--fw-bold) var(--fs-metric)/1 var(--font-display)",color:"var(--ink-0)",letterSpacing:"var(--ls-metric)"}}>33%</span>
              <span style={{color:"var(--ink-2)",font:"var(--type-meta)"}}>de progresso</span>
            </span>
          </div>
        </FolderCard>
        <Panel variant="rail" title="Nesta volta" style={{background:"transparent",flex:1,minWidth:240}}>
          <InfoRow icon="calendar" label="Prazo" value="Hoje" />
          <InfoRow icon="user" label="Responsável" value="Leonardo" />
          <InfoRow icon="target" label="" value="3 checkpoints" />
        </Panel>
      </div>
      <SectionHeader size="h3" title="Todos os projetos" count={6} />
      <DataTable
        columns={[{key:"n",label:"Projeto",sortable:true,sorted:"desc"},{key:"c",label:"Checkpoint atual"},{key:"r",label:"Responsável",width:"180px"},{key:"s",label:"Situação",width:"170px"},{key:"p",label:"Progresso",width:"190px"}]}
        rows={[
          {n:"Proposta comercial",c:"Revisão",r:<><Avatar name="Ana N" size="sm"/><span>Ana</span></>,s:<StatusPill status="late"/>,p:<ProgressBar value={45} width={150}/>},
          {n:"Nova unidade",c:"Viabilidade",r:<><Avatar name="Mariana C" size="sm"/><span>Mariana</span></>,s:<StatusPill status="blocked"/>,p:<ProgressBar value={20} width={150}/>},
          {n:"Implantação do ERP",c:"Cadastro",r:<><Avatar name="Leonardo E" size="sm"/><span>Leonardo</span></>,s:<StatusPill status="soon"/>,p:<ProgressBar value={33} width={150}/>}]}
        activeRow={2} />
    </div>
  );
  ReactDOM.createRoot(document.getElementById("root")).render(<Card />);
}).catch(e => { document.getElementById("root").innerHTML = '<pre style="color:#FF5A5A;font:13px/1.5 monospace">'+e.message+'</pre>'; }); })();
</script></body></html>
