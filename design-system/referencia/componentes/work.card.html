<!doctype html><html data-ds="trackward" lang="pt-BR"><head><meta charset="utf-8"><title>TrackWard</title>
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="https://unpkg.com/lucide@0.454.0/dist/umd/lucide.min.js"></script>
<script src="../../ds-boot.js"></script>
<script>/* preview shim: this sandbox only serves subresources with the page's ?t= token */
(function(){var t=new URL(location.href).searchParams.get("t");if(!t)return;var q="?t="+t;
var l=document.createElement("link");l.rel="stylesheet";l.href="../../styles.css"+q;document.head.appendChild(l);
["../../ds-boot.js"].forEach(function(s){var e=document.createElement("script");e.src=s+q;e.async=false;document.head.appendChild(e)});})();</script>
<style>html,body{margin:0;background:var(--bg-page)}#root{padding:22px 24px}.row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.col{display:grid;gap:16px}.lbl{color:var(--ink-3);font:var(--type-micro);letter-spacing:.06em;text-transform:uppercase}</style>
</head><body><div id="root"></div>
<script type="text/babel" data-presets="react">
(function wait(){ if (!window.DSBoot) return setTimeout(wait, 40);
DSBoot().then(NS => {
  const { TaskRow, ChatMessage, Composer, AiBanner, ProposalItem, ProposalDiff, ActivityItem, Button, Divider } = NS;
  const Card = () => {
    const [done, setDone] = React.useState(false);
    return (
      <div className="col" style={{gap:18}}>
        <TaskRow title="Conferir documentos" description="Confira os documentos recebidos antes da validação."
          done={done} onToggle={()=>setDone(!done)} assignee="Leonardo E" assigneeLabel="Você" due="Hoje"
          action={<Button size="sm">Concluir tarefa</Button>} />
        <TaskRow blocked title="Validar base" description="Aguardando Mariana concluir a revisão." assignee="Mariana C" due="em 4 dias" dueTone="warn" />
        <AiBanner title="3 propostas aguardam revisão" subtitle="Tarefa, prazo e decisão" action="Revisar propostas" />
        <div style={{display:"grid",gridTemplateColumns:"minmax(0,1fr) minmax(0,1fr)",gap:24}}>
          <div className="col" style={{gap:6}}>
            <ChatMessage author="Ana" time="09:10">Preciso de mais dois dias para revisar os cadastros.</ChatMessage>
            <ChatMessage author="Leonardo" time="09:12" mention="Mariana">prepare a lista de documentos que faltam para amanhã.</ChatMessage>
            <Composer />
          </div>
          <div className="col" style={{gap:8}}>
            <ProposalItem kind="Prazo" title="Revisar cadastros" meta="Amanhã → em 3 dias" selected />
            <ProposalDiff from="Amanhã" to="em 3 dias" />
            <ActivityItem who="Mariana" action="concluiu" target="Importar clientes" time="há 12 min" />
          </div>
        </div>
      </div>
    );
  };
  ReactDOM.createRoot(document.getElementById("root")).render(<Card />);
}).catch(e => { document.getElementById("root").innerHTML = '<pre style="color:#FF5A5A;font:13px/1.5 monospace">'+e.message+'</pre>'; }); })();
</script></body></html>
