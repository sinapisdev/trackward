<!doctype html><html data-ds="trackward" lang="pt-BR"><head><meta charset="utf-8"><title>TrackWard</title>
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="https://unpkg.com/lucide@0.454.0/dist/umd/lucide.min.js"></script>
<script src="../../ds-boot.js"></script>
<script>/* preview shim: this sandbox only serves subresources with the page's ?t= token */
(function(){var t=new URL(location.href).searchParams.get("t");if(!t)return;var q="?t="+t;
var l=document.createElement("link");l.rel="stylesheet";l.href="../../styles.css"+q;document.head.appendChild(l);
["../../ds-boot.js"].forEach(function(s){var e=document.createElement("script");e.src=s+q;e.async=false;document.head.appendChild(e)});})();</script>
<style>html,body{margin:0;background:var(--bg-page)}#root{padding:22px 24px}.row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.col{display:grid;gap:16px}.lbl{color:var(--ink-3);font:var(--type-micro);letter-spacing:.06em;text-transform:uppercase}</style>
</head><body><div id="root"></div>
<script type="text/babel" data-presets="react">
(function wait(){ if (!window.DSBoot) return setTimeout(wait, 40);
DSBoot().then(NS => {
  const { Field, Input, Select, Checkbox, Radio, RadioCard, Switch, Textarea, Icon, Kbd } = NS;
  const Card = () => {
    const [on, setOn] = React.useState(true);
    const [tipo, setTipo] = React.useState("Projeto");
    const [done, setDone] = React.useState(true);
    return (
      <div className="col" style={{gap:20}}>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:18}}>
          <Field label="E-mail"><Input placeholder="voce@empresa.com" /></Field>
          <Field label="Senha"><Input type="password" revealable defaultValue="senha1234" /></Field>
          <Field label="Buscar"><Input leading={<Icon name="search" size={17} />} trailing={<Kbd>/</Kbd>} placeholder="Buscar tracks" /></Field>
          <Field label="Área" optional><Select options={["Operações","Financeiro","Comercial"]} value="Operações" onChange={()=>{}} /></Field>
        </div>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12}}>
          <RadioCard name="t" radioSide="left" checked={tipo==="Projeto"} onChange={()=>setTipo("Projeto")} title="Projeto" description="Tem início e conclusão" />
          <RadioCard name="t" radioSide="left" checked={tipo==="Rotina"} onChange={()=>setTipo("Rotina")} title="Rotina" description="Repete dentro de uma área" />
        </div>
        <div className="row" style={{gap:30}}>
          <Checkbox checked={done} onChange={()=>setDone(!done)} label="Importar clientes" />
          <Checkbox label="Conferir documentos" />
          <Radio checked label="Toda a equipe" />
          <Switch checked={on} onChange={()=>setOn(!on)} label="Ativar leitura com IA" />
        </div>
      </div>
    );
  };
  ReactDOM.createRoot(document.getElementById("root")).render(<Card />);
}).catch(e => { document.getElementById("root").innerHTML = '<pre style="color:#FF5A5A;font:13px/1.5 monospace">'+e.message+'</pre>'; }); })();
</script></body></html>
