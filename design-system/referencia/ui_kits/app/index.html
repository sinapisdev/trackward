<!-- @dsCard group="App" viewport="1440x900" name="TrackWard app" subtitle="Click-through recreation: visão geral, fila, projetos, trilha, conversa, agenda" -->
<!doctype html><html data-ds="trackward" lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TrackWard — app</title>
<link rel="stylesheet" href="../../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="https://unpkg.com/lucide@0.454.0/dist/umd/lucide.min.js"></script>
<script src="../../../ds-boot.js"></script>
<script src="../kit-boot.js"></script>
<script>/* sandbox preview: subresources are only served with the page's ?t= token */
(function(){var t=new URL(location.href).searchParams.get("t");if(!t)return;var q="?t="+t;
["../../../ds-boot.js","../kit-boot.js"].forEach(function(s){var e=document.createElement("script");e.src=s+q;e.async=false;document.head.appendChild(e)});})();</script>
<style>html,body{margin:0;background:var(--bg-page);min-height:100%}#root{min-height:100vh;display:grid;grid-template-rows:auto 1fr auto}</style>
</head><body><div id="root"></div>
<script type="text/babel" data-presets="react">
(function wait(){
  if (!window.KitBoot) return setTimeout(wait, 40);
  KitBoot(["Shell","AppData","Overview","MyWork","Projects","Workspace","Routines","RoutineOpen","Conversa","Proposals","Agenda","Processes","ProcessEditor","CreateTrack","TaskDetail","Team","Settings"]).then(S => {
    const { TopNav, AppFooter } = window.TrackWardDesignSystem_3f3083;
    const data = S.AppData();
    const PARENT = { "Projeto": "Projetos", "Tarefa": "Meu trabalho", "Propostas": "Conversa", "Criar track": "Projetos", "Rotina": "Rotinas", "Editor": "Processos" };

    function App() {
      const [route, setRoute] = React.useState("Visão geral");
      const go = r => { setRoute(r); window.scrollTo({ top: 0 }); };
      const active = PARENT[route] || route;
      const screens = {
        "Visão geral": <S.Overview data={data} go={go} />,
        "Meu trabalho": <S.MyWork data={data} go={go} />,
        "Projetos": <S.Projects data={data} go={go} />,
        "Projeto": <S.Workspace data={data} go={go} />,
        "Rotinas": <S.Routines data={data} go={go} />,
        "Rotina": <S.RoutineOpen data={data} go={go} />,
        "Conversa": <S.Conversa data={data} go={go} />,
        "Propostas": <S.Proposals data={data} go={go} />,
        "Agenda": <S.Agenda data={data} go={go} />,
        "Processos": <S.Processes data={data} go={go} />,
        "Editor": <S.ProcessEditor data={data} go={go} />,
        "Criar track": <S.CreateTrack data={data} go={go} />,
        "Tarefa": <S.TaskDetail data={data} go={go} />,
        "Equipe": <S.Team data={data} go={go} />,
        "Ajustes": <S.Settings data={data} go={go} />,
      };
      return (
        <>
          <TopNav items={data.routes} active={active} onNavigate={go} org={data.org} user={data.user}
            settingsActive={route === "Ajustes"} onTeamClick={() => go("Equipe")} onSettingsClick={() => go("Ajustes")} />
          <main style={{ minWidth: 0 }}>{screens[route] || screens["Visão geral"]}</main>
          <AppFooter org={data.org} />
        </>
      );
    }
    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  }).catch(e => { document.getElementById("root").innerHTML = '<pre style="color:#FF5A5A;padding:20px;font:13px/1.6 monospace">'+e.message+'</pre>'; });
})();
</script></body></html>
