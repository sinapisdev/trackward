<!-- @dsCard group="Mobile" viewport="430x932" name="Painel mobile" subtitle="The phone dashboard: same tracks, one thumb" -->
<!doctype html><html data-ds="trackward" lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TrackWard — mobile</title>
<link rel="stylesheet" href="../../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="https://unpkg.com/lucide@0.454.0/dist/umd/lucide.min.js"></script>
<script src="../../../ds-boot.js"></script>
<script src="../kit-boot.js"></script>
<script>/* sandbox preview: subresources are only served with the page's ?t= token */
(function(){var t=new URL(location.href).searchParams.get("t");if(!t)return;var q="?t="+t;
["../../../ds-boot.js","../kit-boot.js"].forEach(function(s){var e=document.createElement("script");e.src=s+q;e.async=false;document.head.appendChild(e)});})();</script>
<style>html,body{margin:0;background:#000;min-height:100%}#root{display:grid;place-items:start center}
.phone{width:430px;height:932px;overflow:hidden;background:var(--bg-page);position:relative}
.home-indicator{position:absolute;left:50%;transform:translateX(-50%);bottom:8px;width:140px;height:5px;border-radius:999px;background:var(--ink-0);opacity:.9}</style>
</head><body><div id="root"></div>
<script type="text/babel" data-presets="react">
(function wait(){
  if (!window.KitBoot) return setTimeout(wait, 40);
  Promise.all([KitBoot(["Painel"]), KitBoot(["AppData"], "../app/")]).then(([S, D]) => {
    const data = D.AppData();
    function Phone() {
      const [tab, setTab] = React.useState("Painel");
      return (
        <div className="phone">
          {tab === "Painel" ? <S.Painel data={data} tab={tab} setTab={setTab} /> : <S.NotInSource tab={tab} setTab={setTab} />}
          <span className="home-indicator" />
        </div>
      );
    }
    ReactDOM.createRoot(document.getElementById("root")).render(<Phone />);
  }).catch(e => { document.getElementById("root").innerHTML = '<pre style="color:#FF5A5A;padding:20px;font:13px/1.6 monospace">'+e.message+'</pre>'; });
})();
</script></body></html>
